[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "componergy"
version = "0.1.0"
description = "Compound drought-heat impacts on electricity systems"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "matplotlib",
    "geopandas",
    "requests",
    "tqdm",
    "rioxarray",
    "netCDF4",
    "dask",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "componergy"
version = "0.1.0"
description = "Compound drought-heat impacts on electricity systems"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "matplotlib",
    "geopandas",
    "requests",
    "tqdm",
    "netCDF4",
    "rioxarray",
    "dask",
    "joblib",
    "cartopy",
    "regionmask",
]

[project.optional-dependencies]
dev = ["pytest", "statsmodels"]
notebooks = ["jupyterlab", "ipykernel", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore:Use `@` matmul instead of `\\*` mul operator for matrix multiplication:PendingDeprecationWarning",
]
